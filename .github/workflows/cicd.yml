name: CICD

on:
  push: 
    branches: 
      - deploy-to-ec2

jobs: 
  build: 
    runs-on: ubuntu-latest
    steps: 
      - name: Checkout Source Code
        uses: actions/checkout@v3
      - name: Login to Docker Hub
        run: docker login -u ${{secrets.DOCKER_NAME}} -p ${{secrets.DOCKER_PASSWORD}}
      - name: Build Docker Image
        run: docker build -t charuvatsala/react-app .
      - name: Publish image to Docker hub
        run: docker push charuvatsala/react-app:latest
  
  deploy:
    needs: build
    runs-on: ip-172-31-95-9
    steps:
    - name: pull image from docker hub
      run: docker pull charuvatsala/react-app:latest
    - name: Delete old container
      run: docker rm -f reactContainer
    - name: Run docker container 
      run: docker run -d -p 3000:80 --name reactContainer charuvatsala/react-app
